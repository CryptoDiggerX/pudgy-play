<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:;">
  <meta http-equiv="X-Frame-Options" content="ALLOWALL">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pudgy Jump</title>
  <meta name="description" content="Pudgy Jump — Base-powered jump mini game on Farcaster." />
  <meta property="og:title" content="Pudgy Jump" />
  <meta property="og:image" content="https://i.imgur.com/48neImL.png" />
  <meta name="fc:miniapp" content='{"version":"1","imageUrl":"https://i.imgur.com/48neImL.png","button":{"title":"Play Pudgy Jump","action":{"type":"launch_frame","name":"Pudgy Jump","url":"https://pudgy-play.vercel.app","splashImageUrl":"https://i.imgur.com/48neImL.png","splashBackgroundColor":"#08172b"}}}' />
  <meta name="fc:frame" content='{"version":"1","imageUrl":"https://i.imgur.com/48neImL.png","button":{"title":"Play Pudgy Jump","action":{"type":"launch_frame","name":"Pudgy Jump","url":"https://pudgy-play.vercel.app","splashImageUrl":"https://i.imgur.com/48neImL.png","splashBackgroundColor":"#08172b"}}}' />
  <style>
    :root{--bg1:#071427;--bg2:#0c2f57;--card:#0c3761ee;--cardBorder:#7da7c9aa;--accent:#9f4dff;--accent2:#c86bff;--text:#fff;--muted:#c9dbf4;--success:#52f7a7;--shadow:0 18px 50px rgba(0,0,0,.38);}
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;font-family:system-ui,sans-serif;background:radial-gradient(circle at top,#19538a 0%,var(--bg2) 35%,var(--bg1) 100%);color:var(--text);overflow:hidden;}
    button{font:inherit;cursor:pointer}
    .app{position:relative;height:100%;display:flex;align-items:center;justify-content:center;padding:18px;}
    .blur-bg{position:absolute;inset:0;background:linear-gradient(rgba(7,20,39,.45),rgba(7,20,39,.65));filter:blur(12px);transform:scale(1.1);}
    .top-title{position:absolute;top:14px;left:0;right:0;text-align:center;font-weight:800;font-size:18px;text-shadow:0 2px 8px rgba(0,0,0,.5);z-index:2;}
    .modal{position:relative;z-index:2;width:min(92vw,400px);background:var(--card);border:1px solid var(--cardBorder);border-radius:22px;padding:24px 20px 20px;box-shadow:var(--shadow);backdrop-filter:blur(20px);}
    .pill{display:inline-block;background:#3e89ff;color:#fff;border-radius:999px;padding:5px 13px;font-size:12px;font-weight:800;margin-bottom:12px;}
    .center{text-align:center}
    h1{font-size:28px;line-height:1.1;margin-bottom:8px}
    .sub{color:var(--muted);font-size:14px;line-height:1.5}
    .fee-box{margin:18px 0 14px;background:#061a33;border:1px solid rgba(125,167,201,.3);border-radius:14px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;font-size:13px;}
    .fee-box strong{color:var(--success);font-size:15px;font-weight:800}
    .toggle{display:flex;gap:8px;margin-bottom:14px}
    .toggle button{flex:1;border:none;border-radius:12px;padding:11px 8px;background:#0a2443;color:#dbe8f8;font-weight:700;font-size:13px;}
    .toggle button.active{background:#153a67;color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2);}
    .start-btn{width:100%;border:none;border-radius:14px;padding:15px;background:linear-gradient(180deg,var(--accent2),var(--accent));color:#fff;font-weight:900;font-size:16px;box-shadow:0 8px 22px rgba(159,77,255,.4);}
    .start-btn:disabled{opacity:.5;cursor:not-allowed}
    .hint{margin-top:10px;font-size:12px;color:#bfd0e7;text-align:center;min-height:18px}
    .bottom-nav{position:absolute;z-index:2;left:50%;transform:translateX(-50%);bottom:14px;width:min(92vw,460px);background:rgba(17,52,90,.75);border:1px solid rgba(145,179,215,.3);border-radius:18px;padding:8px;display:flex;gap:4px;backdrop-filter:blur(16px);}
    .tab{flex:1;text-align:center;padding:9px 0;border-radius:12px;font-size:11px;font-weight:700;color:#e6efff;user-select:none;}
    .tab.active{background:linear-gradient(180deg,#b05cff,#7a3cff)}
    .game-overlay{display:none;position:fixed;inset:0;z-index:5;background:rgba(0,0,0,.6);align-items:center;justify-content:center;padding:16px;}
    .game-card{width:min(92vw,400px);background:#0b2446;border:1px solid rgba(125,167,201,.3);border-radius:22px;padding:20px;box-shadow:var(--shadow);text-align:center;}
    .game-card h2{font-size:20px;margin-bottom:8px}
    .score-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:12px;color:var(--muted);}
    .score-val{font-weight:800;color:#fff;font-size:16px}
    .game-area{height:190px;border-radius:16px;background:linear-gradient(180deg,#0f2a52 0%,#071a35 100%);position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.08);cursor:pointer;}
    .game-area::before{content:'';position:absolute;inset:0;background:radial-gradient(1px 1px at 15% 20%,#fff 0%,transparent 100%),radial-gradient(1px 1px at 40% 10%,#fff 0%,transparent 100%),radial-gradient(1.5px 1.5px at 70% 25%,#fff 0%,transparent 100%),radial-gradient(1px 1px at 85% 15%,#fff 0%,transparent 100%);opacity:.6;}
    .ground{position:absolute;bottom:0;left:0;right:0;height:20px;background:linear-gradient(180deg,#1e5a9e,#0d3060);border-top:1px solid rgba(100,180,255,.2);}
    .runner{position:absolute;left:36px;bottom:20px;width:28px;height:34px;border-radius:50% 50% 40% 40%;background:linear-gradient(180deg,#1a1a2e,#16213e);box-shadow:inset -3px -3px 6px rgba(0,0,0,.4),0 4px 12px rgba(0,0,0,.4);}
    .runner::before{content:'';position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:14px;height:18px;border-radius:50%;background:linear-gradient(180deg,#e8e8e8,#c8c8c8);}
    .runner::after{content:'';position:absolute;top:6px;left:14px;width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px #111,inset 2px 2px 0 rgba(0,0,0,.8);}
    .runner.dead{filter:hue-rotate(270deg) brightness(.7)}
    .jump{animation:jump .48s cubic-bezier(.36,.07,.19,.97)}
    @keyframes jump{0%{transform:translateY(0) rotate(0deg)}40%{transform:translateY(-75px) rotate(-8deg)}100%{transform:translateY(0) rotate(0deg)}}
    .game-over-msg{display:none;position:absolute;inset:0;background:rgba(0,0,0,.75);border-radius:16px;align-items:center;justify-content:center;flex-direction:column;gap:8px;z-index:2;}
    .game-over-msg h3{font-size:22px;color:#ff6b6b;}
    .game-over-msg span{font-size:13px;color:var(--muted)}
    .game-footer{display:flex;gap:10px;margin-top:12px}
    .btn-secondary{flex:1;border:none;border-radius:12px;padding:12px;background:#17365e;color:#fff;font-weight:800;font-size:14px}
    .btn-primary{flex:1;border:none;border-radius:12px;padding:12px;background:linear-gradient(180deg,var(--accent2),var(--accent));color:#fff;font-weight:900;font-size:14px}
    .tap-hint{position:absolute;bottom:28px;right:10px;font-size:10px;color:rgba(255,255,255,.4);animation:blink 1.5s ease-in-out infinite;}
    @keyframes blink{0%,100%{opacity:.4}50%{opacity:1}}
  </style>
  <!-- Farcaster SDK: dismisses splash screen via sdk.actions.ready() -->
  <script src="https://cdn.jsdelivr.net/npm/@farcaster/miniapp-sdk/dist/index.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@farcaster/frame-sdk/dist/index.min.js"></script>
</head>
<body>
<div class="app">
  <div class="blur-bg"></div>
  <div class="top-title">Pudgy Jump</div>
  <section class="modal" id="payModal">
    <div class="center">
      <div class="pill">BASE</div>
      <h1>PAY TO PLAY</h1>
      <p class="sub">Each run costs <strong style="color:#f7c752">$0.03</strong>, paid in ETH on Base.</p>
    </div>
    <div class="fee-box">
      <span>EST. ETH</span>
      <strong id="feeText">~0.0000100 ETH</strong>
    </div>
    <div class="toggle">
      <button class="active" id="ethBtn" type="button">Base ETH</button>
      <button id="usdcBtn" type="button">USDC</button>
    </div>
    <button class="start-btn" id="startBtn" type="button">PAY $0.03 &amp; START</button>
    <div class="hint" id="hint">Confirm the Base ETH payment in your wallet to start.</div>
  </section>
  <nav class="bottom-nav">
    <div class="tab active">Play</div>
    <div class="tab">Quests</div>
    <div class="tab">Leaderboard</div>
    <div class="tab">Airdrop</div>
    <div class="tab">Invite</div>
    <div class="tab">Shop</div>
  </nav>
</div>

<div class="game-overlay" id="gameOverlay">
  <div class="game-card">
    <h2>Pudgy Jump</h2>
    <div class="score-bar">
      <span>SCORE</span><span class="score-val" id="scoreDisplay">0</span>
      <span>BEST</span><span class="score-val" id="bestDisplay">0</span>
    </div>
    <div class="game-area" id="gameArea">
      <div class="ground"></div>
      <div class="runner" id="runner"></div>
      <div class="tap-hint">TAP TO JUMP</div>
      <div class="game-over-msg" id="gameOverMsg">
        <h3>GAME OVER</h3>
        <span id="finalScore">Score: 0</span>
      </div>
    </div>
    <div class="game-footer">
      <button class="btn-secondary" id="jumpBtn" type="button">&#8679; Jump</button>
      <button class="btn-primary" id="resetBtn" type="button">&#8635; Restart</button>
    </div>
  </div>
</div>

<script>
// ── Call sdk.actions.ready() to dismiss Warpcast splash screen ──
window.addEventListener("load", function() {
  try {
    // miniapp-sdk UMD global is "miniapp"
    if (window.miniapp && window.miniapp.sdk && window.miniapp.sdk.actions) {
      window.miniapp.sdk.actions.ready();
    }
    // frame-sdk UMD global is "frame"
    if (window.frame && window.frame.sdk && window.frame.sdk.actions) {
      window.frame.sdk.actions.ready();
    }
  } catch(e) { console.warn("SDK ready error:", e); }
});

// ── Game logic ──
(function () {
  "use strict";
  var RECEIVER   = "0x580Aab97021D7D379c8d26444eAae332C3014ba7";
  var BASE_CHAIN = "0x2105";
  var PRICE_HEX  = "0x1B48EB57E000";

  var ethBtn=document.getElementById("ethBtn"),usdcBtn=document.getElementById("usdcBtn"),startBtn=document.getElementById("startBtn"),feeText=document.getElementById("feeText"),hint=document.getElementById("hint"),payModal=document.getElementById("payModal"),gameOverlay=document.getElementById("gameOverlay"),gameArea=document.getElementById("gameArea"),runner=document.getElementById("runner"),jumpBtn=document.getElementById("jumpBtn"),resetBtn=document.getElementById("resetBtn"),scoreDisplay=document.getElementById("scoreDisplay"),bestDisplay=document.getElementById("bestDisplay"),gameOverMsg=document.getElementById("gameOverMsg"),finalScore=document.getElementById("finalScore");
  var payMode="eth",paid=false,best=parseInt(localStorage.getItem("pj_best")||"0"),score=0,gameSpeed=2.5,frameCount=0,spawnTimer=0,coinTimer=0,gameRunning=false,isJumping=false,isDead=false,obstacles=[],coins=[],raf=null;
  bestDisplay.textContent=best;

  function renderMode(){ethBtn.classList.toggle("active",payMode==="eth");usdcBtn.classList.toggle("active",payMode==="usdc");feeText.textContent=payMode==="eth"?"~0.0000100 ETH":"USDC $0.03";}
  ethBtn.addEventListener("click",function(){payMode="eth";renderMode();});
  usdcBtn.addEventListener("click",function(){payMode="usdc";renderMode();});

  // Get wallet provider — Warpcast SDK or MetaMask
  function getProvider() {
    // 1. Warpcast miniapp-sdk provider
    if (window.miniapp && window.miniapp.sdk && window.miniapp.sdk.wallet && window.miniapp.sdk.wallet.ethProvider) {
      return window.miniapp.sdk.wallet.ethProvider;
    }
    // 2. Warpcast frame-sdk provider
    if (window.frame && window.frame.sdk && window.frame.sdk.wallet && window.frame.sdk.wallet.ethProvider) {
      return window.frame.sdk.wallet.ethProvider;
    }
    // 3. MetaMask / injected
    if (typeof window.ethereum !== "undefined") {
      return window.ethereum;
    }
    return null;
  }

  function doPayment(){
    var provider = getProvider();
    if (!provider) return Promise.reject(new Error("No wallet detected. Open in Warpcast or install MetaMask."));

    return provider.request({method:"eth_requestAccounts"}).then(function(accs){
      var from = accs[0];
      return provider.request({method:"wallet_switchEthereumChain",params:[{chainId:BASE_CHAIN}]}).catch(function(e){
        if(e.code===4902||e.code===-32603){
          return provider.request({method:"wallet_addEthereumChain",params:[{chainId:BASE_CHAIN,chainName:"Base",nativeCurrency:{name:"Ether",symbol:"ETH",decimals:18},rpcUrls:["https://mainnet.base.org"],blockExplorerUrls:["https://basescan.org"]}]});
        }
        throw e;
      }).then(function(){
        return provider.request({method:"eth_sendTransaction",params:[{from:from,to:RECEIVER,value:PRICE_HEX,chainId:BASE_CHAIN}]});
      });
    });
  }

  startBtn.addEventListener("click",function(){
    startBtn.disabled=true;startBtn.textContent="PROCESSING...";hint.textContent="Confirm payment in your wallet...";
    doPayment().then(function(){paid=true;payModal.style.display="none";gameOverlay.style.display="flex";startRun();}).catch(function(e){startBtn.disabled=false;startBtn.textContent="PAY $0.03 & START";hint.textContent=e.code===4001?"Payment rejected. Try again.":(e.message||"Payment failed.");});
  });

  function startRun(){
    obstacles.forEach(function(o){o.el.remove();});coins.forEach(function(c){c.el.remove();});
    obstacles=[];coins=[];score=0;gameSpeed=2.5;frameCount=0;spawnTimer=0;coinTimer=0;
    isDead=false;isJumping=false;gameRunning=true;runner.className="runner";
    gameOverMsg.style.display="none";scoreDisplay.textContent="0";
    if(raf)cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);
  }

  function loop(){
    if(!gameRunning)return;frameCount++;
    if(frameCount%180===0)gameSpeed=Math.min(gameSpeed+0.35,9);
    score++;scoreDisplay.textContent=score;
    spawnTimer++;if(spawnTimer>=Math.max(52,105-frameCount*0.06)){spawnTimer=0;spawnObs();}
    coinTimer++;if(coinTimer>=90){coinTimer=0;if(Math.random()>.45)spawnCoin();}
    obstacles=obstacles.filter(function(o){o.x-=gameSpeed;o.el.style.left=o.x+"px";if(o.x<-32){o.el.remove();return false;}return true;});
    coins=coins.filter(function(c){c.x-=gameSpeed;c.el.style.left=c.x+"px";if(c.x<-20){c.el.remove();return false;}return true;});
    var rR=runner.getBoundingClientRect(),aR=gameArea.getBoundingClientRect();
    for(var i=0;i<obstacles.length;i++){var o=obstacles[i];var oL=aR.left+o.x,oR=oL+20,oT=aR.bottom-20-o.h;if(rR.right-6>oL+3&&rR.left+6<oR-3&&rR.bottom-4>oT&&rR.top+4<aR.bottom-20){die();return;}}
    coins=coins.filter(function(c){var cL=aR.left+c.x,cT=aR.top+c.y;if(rR.right-4>cL&&rR.left+4<cL+15&&rR.bottom-4>cT&&rR.top+4<cT+15){score+=15;c.el.remove();return false;}return true;});
    raf=requestAnimationFrame(loop);
  }

  function spawnObs(){var el=document.createElement("div");var h=26+Math.random()*36,x=gameArea.offsetWidth+8;el.style.cssText="position:absolute;left:"+x+"px;bottom:20px;width:20px;height:"+h+"px;border-radius:6px 6px 4px 4px;background:linear-gradient(180deg,#52f7a7,#16b36f);box-shadow:0 0 10px rgba(82,247,167,.3);";gameArea.appendChild(el);obstacles.push({el:el,x:x,h:h});}
  function spawnCoin(){var el=document.createElement("div");var x=gameArea.offsetWidth+8,y=gameArea.offsetHeight-20-50-Math.random()*60;el.style.cssText="position:absolute;left:"+x+"px;top:"+y+"px;width:15px;height:15px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe566,#d4a017);border:1.5px solid rgba(255,255,255,.6);box-shadow:0 0 8px rgba(255,215,0,.5);";gameArea.appendChild(el);coins.push({el:el,x:x,y:y});}
  function die(){gameRunning=false;isDead=true;runner.classList.add("dead");if(score>best){best=score;localStorage.setItem("pj_best",best);bestDisplay.textContent=best;}finalScore.textContent="Score: "+score+(score===best&&score>0?"  \uD83C\uDFC6 New Best!":"");gameOverMsg.style.display="flex";}
  function jump(){if(isDead||isJumping)return;isJumping=true;runner.classList.remove("jump");void runner.offsetWidth;runner.classList.add("jump");setTimeout(function(){isJumping=false;},480);}
  jumpBtn.addEventListener("click",jump);
  gameArea.addEventListener("click",jump);
  document.addEventListener("keydown",function(e){if(e.code==="Space"||e.code==="ArrowUp"){e.preventDefault();jump();}});
  resetBtn.addEventListener("click",function(){if(paid){startRun();}else{gameOverlay.style.display="none";payModal.style.display="";}});
  renderMode();
})();
</script>
</body>
</html>
